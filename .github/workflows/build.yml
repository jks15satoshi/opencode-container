name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_opencode:
        description: "Build OpenCode image"
        type: boolean
        default: true
      build_openchamber:
        description: "Build OpenChamber image"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      opencode_changed: ${{ steps.detect.outputs.opencode_changed }}
      opencode_new: ${{ steps.detect.outputs.opencode_new }}
      openchamber_changed: ${{ steps.detect.outputs.openchamber_changed }}
      openchamber_new: ${{ steps.detect.outputs.openchamber_new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        run: |
          # Determine output version: regular if base tag absent, rev otherwise
          rev_version() {
            local target="$1"
            local version="$2"
            local base_tag="${target}/v${version}"
            if git rev-parse "$base_tag" >/dev/null 2>&1; then
              local latest_rev
              latest_rev=$(git tag -l "${base_tag}-rev.*" | sort -V | tail -1)
              local next_rev=1
              if [ -n "$latest_rev" ]; then
                next_rev=$((${latest_rev##*-rev.} + 1))
              fi
              echo "${version}-rev.${next_rev}"
            else
              echo "$version"
            fi
          }

          NEW_OPENCODE=$(awk -F= '/^ARG OPENCODE_VERSION=/{print $2; exit}' Dockerfile)
          NEW_CHAMBER=$(awk -F= '/^ARG OPENCHAMBER_VERSION=/{print $2; exit}' Dockerfile)

          echo "OPENCODE version: ${NEW_OPENCODE}"
          echo "OPENCHAMBER version: ${NEW_CHAMBER}"

          OPENCODE_CHANGED="false"
          OPENCHAMBER_CHANGED="false"
          OPENCODE_OUT="$NEW_OPENCODE"
          OPENCHAMBER_OUT="$NEW_CHAMBER"

          # --- workflow_dispatch ---
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Trigger: workflow_dispatch"

            if [ "${{ inputs.build_opencode }}" = "true" ]; then
              OPENCODE_CHANGED="true"
              OPENCODE_OUT=$(rev_version "opencode" "$NEW_OPENCODE")
              echo "Building opencode: ${OPENCODE_OUT}"
            fi

            if [ "${{ inputs.build_openchamber }}" = "true" ]; then
              OPENCHAMBER_CHANGED="true"
              OPENCHAMBER_OUT=$(rev_version "openchamber" "$NEW_CHAMBER")
              echo "Building openchamber: ${OPENCHAMBER_OUT}"
            fi

          # --- push ---
          else
            IS_RENOVATE="false"
            AUTHOR="${{ github.event.head_commit.author.username }}"
            COMMITTER="${{ github.event.head_commit.committer.username }}"
            if [ "$AUTHOR" = "renovate[bot]" ] || [ "$COMMITTER" = "renovate[bot]" ]; then
              IS_RENOVATE="true"
            fi

            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            if [ "$IS_RENOVATE" = "true" ]; then
              echo "Trigger: push (Renovate)"

              if ! [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                if git diff "$BEFORE" "$AFTER" -- Dockerfile | grep -qE '^[-+].*OPENCODE_VERSION='; then
                  OPENCODE_CHANGED="true"
                  OPENCODE_OUT=$(rev_version "opencode" "$NEW_OPENCODE")
                  echo "OPENCODE_VERSION changed -> building opencode: ${OPENCODE_OUT}"
                fi

                if git diff "$BEFORE" "$AFTER" -- Dockerfile | grep -qE '^[-+].*OPENCHAMBER_VERSION='; then
                  OPENCHAMBER_CHANGED="true"
                  OPENCHAMBER_OUT=$(rev_version "openchamber" "$NEW_CHAMBER")
                  echo "OPENCHAMBER_VERSION changed -> building openchamber: ${OPENCHAMBER_OUT}"
                fi

                if git diff "$BEFORE" "$AFTER" -- Dockerfile | grep -qE '^[-+].*BUN_VERSION='; then
                  OPENCODE_CHANGED="true"
                  OPENCHAMBER_CHANGED="true"
                  OPENCODE_OUT=$(rev_version "opencode" "$NEW_OPENCODE")
                  OPENCHAMBER_OUT=$(rev_version "openchamber" "$NEW_CHAMBER")
                  echo "BUN_VERSION changed -> building both images"
                fi
              fi

            else
              echo "Trigger: push (non-Renovate)"

              # --- entrypoint.sh ---
              ENTRYPOINT_CHANGED="false"
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
                 ! git diff --quiet "$BEFORE" "$AFTER" -- entrypoint.sh 2>/dev/null; then
                ENTRYPOINT_CHANGED="true"
                echo "entrypoint.sh changed"
              fi

              # --- Dockerfile stage-level changes ---
              BASE_CHANGED="false"
              OC_STAGE_CHANGED="false"
              CH_STAGE_CHANGED="false"

              OC_START=$(awk '/^FROM base AS opencode$/{print NR; exit}' Dockerfile)
              CH_START=$(awk '/^FROM base AS openchamber$/{print NR; exit}' Dockerfile)

              if [ -n "$OC_START" ] && [ -n "$CH_START" ] && \
                 [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                STAGES=$(git diff "$BEFORE" "$AFTER" -- Dockerfile | awk \
                  -v oc="$OC_START" -v ch="$CH_START" '
                  /^@@/ {
                    plus = $3
                    gsub(/^\+/, "", plus)
                    split(plus, nr, ",")
                    ns = nr[1] + 0
                    if (ns < oc)      print "BASE"
                    else if (ns < ch) print "OPENCODE"
                    else              print "OPENCHAMBER"
                  }' | sort -u)

                if echo "$STAGES" | grep -qx "BASE";        then BASE_CHANGED="true";        fi
                if echo "$STAGES" | grep -qx "OPENCODE";    then OC_STAGE_CHANGED="true";    fi
                if echo "$STAGES" | grep -qx "OPENCHAMBER"; then CH_STAGE_CHANGED="true";   fi

                echo "Dockerfile stages: base=${BASE_CHANGED}, opencode=${OC_STAGE_CHANGED}, openchamber=${CH_STAGE_CHANGED}"
              elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
                   [ -z "$OC_START" ] || [ -z "$CH_START" ]; then
                BASE_CHANGED="true"
                echo "Dockerfile stage fallback: treating as base changed"
              fi

              # --- decide what to build ---
              if [ "$ENTRYPOINT_CHANGED" = "true" ] || [ "$BASE_CHANGED" = "true" ] || [ "$OC_STAGE_CHANGED" = "true" ]; then
                OPENCODE_CHANGED="true"
                OPENCODE_OUT=$(rev_version "opencode" "$NEW_OPENCODE")
                echo "Building opencode: ${OPENCODE_OUT}"
              fi

              if [ "$ENTRYPOINT_CHANGED" = "true" ] || [ "$BASE_CHANGED" = "true" ] || [ "$CH_STAGE_CHANGED" = "true" ]; then
                OPENCHAMBER_CHANGED="true"
                OPENCHAMBER_OUT=$(rev_version "openchamber" "$NEW_CHAMBER")
                echo "Building openchamber: ${OPENCHAMBER_OUT}"
              fi

              if [ "$OPENCODE_CHANGED" = "false" ] && [ "$OPENCHAMBER_CHANGED" = "false" ]; then
                echo "No relevant changes detected, skipping builds"
              fi
            fi
          fi

          echo "opencode_changed=${OPENCODE_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "opencode_new=${OPENCODE_OUT}" >> "$GITHUB_OUTPUT"
          echo "openchamber_changed=${OPENCHAMBER_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "openchamber_new=${OPENCHAMBER_OUT}" >> "$GITHUB_OUTPUT"

          echo "Results: opencode=${OPENCODE_CHANGED} (${OPENCODE_OUT}), openchamber=${OPENCHAMBER_CHANGED} (${OPENCHAMBER_OUT})"

  # ============================================================
  # Build OpenCode
  # ============================================================
  build-opencode:
    needs: detect
    if: needs.detect.outputs.opencode_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencode:${{ needs.detect.outputs.opencode_new }}
            ghcr.io/${{ github.repository_owner }}/opencode:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push tag
        env:
          NEW_VER: ${{ needs.detect.outputs.opencode_new }}
        run: |
          set -euo pipefail

          TAG="opencode/v${NEW_VER}"

          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag: $TAG"

  # ============================================================
  # Build OpenChamber
  # ============================================================
  build-openchamber:
    needs: detect
    if: needs.detect.outputs.openchamber_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: openchamber
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openchamber:${{ needs.detect.outputs.openchamber_new }}
            ghcr.io/${{ github.repository_owner }}/openchamber:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push tag
        env:
          NEW_VER: ${{ needs.detect.outputs.openchamber_new }}
        run: |
          set -euo pipefail

          TAG="openchamber/v${NEW_VER}"

          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag: $TAG"
