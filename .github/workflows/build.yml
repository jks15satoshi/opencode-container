name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      opencode_changed: ${{ steps.detect.outputs.opencode_changed }}
      opencode_new: ${{ steps.detect.outputs.opencode_new }}
      openchamber_changed: ${{ steps.detect.outputs.openchamber_changed }}
      openchamber_new: ${{ steps.detect.outputs.openchamber_new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version changes and check tags
        id: detect
        run: |
          NEW_OPENCODE=$(sed -n 's/^ARG OPENCODE_VERSION=\(.*\)/\1/p;q' Dockerfile)
          NEW_CHAMBER=$(sed -n 's/^ARG OPENCHAMBER_VERSION=\(.*\)/\1/p;q' Dockerfile)

          echo "OPENCODE version: ${NEW_OPENCODE}"
          echo "OPENCHAMBER version: ${NEW_CHAMBER}"

          # Detect if image definition files (Dockerfile / entrypoint.sh) changed
          FILES_CHANGED="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES_CHANGED="true"
            echo "Trigger: workflow_dispatch (building both targets with rev logic)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
              ! git diff --quiet "$BEFORE" "$AFTER" -- Dockerfile entrypoint.sh 2>/dev/null; then
              FILES_CHANGED="true"
              echo "Image definition files (Dockerfile/entrypoint.sh) changed"
            else
              echo "No image definition file changes detected"
            fi
          fi

          # --- opencode ---
          OPENCODE_CHANGED="false"
          OPENCODE_OUT="$NEW_OPENCODE"
          if [ -n "$NEW_OPENCODE" ]; then
            BASE_TAG="opencode/v${NEW_OPENCODE}"
            if git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
              echo "Base tag $BASE_TAG exists (version unchanged)"
              if [ "$FILES_CHANGED" = "true" ]; then
                LATEST_REV=$(git tag -l "${BASE_TAG}-rev.*" | sort -V | tail -1)
                if [ -z "$LATEST_REV" ]; then
                  NEXT_REV=1
                else
                  REV_NUM=$(echo "$LATEST_REV" | sed 's/.*-rev\.//')
                  NEXT_REV=$((REV_NUM + 1))
                fi
                OPENCODE_OUT="${NEW_OPENCODE}-rev.${NEXT_REV}"
                OPENCODE_CHANGED="true"
                echo "Building opencode rev: ${OPENCODE_OUT}"
              else
                echo "No file changes, skipping opencode"
              fi
            else
              echo "Base tag $BASE_TAG not found, building new version"
              OPENCODE_CHANGED="true"
            fi
          fi

          # --- openchamber ---
          CHAMBER_CHANGED="false"
          CHAMBER_OUT="$NEW_CHAMBER"
          if [ -n "$NEW_CHAMBER" ]; then
            BASE_TAG="openchamber/v${NEW_CHAMBER}"
            if git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
              echo "Base tag $BASE_TAG exists (version unchanged)"
              if [ "$FILES_CHANGED" = "true" ]; then
                LATEST_REV=$(git tag -l "${BASE_TAG}-rev.*" | sort -V | tail -1)
                if [ -z "$LATEST_REV" ]; then
                  NEXT_REV=1
                else
                  REV_NUM=$(echo "$LATEST_REV" | sed 's/.*-rev\.//')
                  NEXT_REV=$((REV_NUM + 1))
                fi
                CHAMBER_OUT="${NEW_CHAMBER}-rev.${NEXT_REV}"
                CHAMBER_CHANGED="true"
                echo "Building openchamber rev: ${CHAMBER_OUT}"
              else
                echo "No file changes, skipping openchamber"
              fi
            else
              echo "Base tag $BASE_TAG not found, building new version"
              CHAMBER_CHANGED="true"
            fi
          fi

          echo "opencode_changed=${OPENCODE_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "opencode_new=${OPENCODE_OUT}" >> "$GITHUB_OUTPUT"
          echo "openchamber_changed=${CHAMBER_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "openchamber_new=${CHAMBER_OUT}" >> "$GITHUB_OUTPUT"

          echo "Results: opencode=${OPENCODE_CHANGED} (${OPENCODE_OUT}), openchamber=${CHAMBER_CHANGED} (${CHAMBER_OUT})"

  # ============================================================
  # Build OpenCode
  # ============================================================
  build-opencode:
    needs: detect
    if: needs.detect.outputs.opencode_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencode:${{ needs.detect.outputs.opencode_new }}
            ghcr.io/${{ github.repository_owner }}/opencode:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push tag
        env:
          NEW_VER: ${{ needs.detect.outputs.opencode_new }}
        run: |
          set -euo pipefail

          TAG="opencode/v${NEW_VER}"

          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag: $TAG"

  # ============================================================
  # Build OpenChamber
  # ============================================================
  build-openchamber:
    needs: detect
    if: needs.detect.outputs.openchamber_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: openchamber
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openchamber:${{ needs.detect.outputs.openchamber_new }}
            ghcr.io/${{ github.repository_owner }}/openchamber:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push tag
        env:
          NEW_VER: ${{ needs.detect.outputs.openchamber_new }}
        run: |
          set -euo pipefail

          TAG="openchamber/v${NEW_VER}"

          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag: $TAG"
