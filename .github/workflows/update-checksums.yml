name: Update dependency checksums
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Fetch and update SHA256 checksums
        run: .github/scripts/update-checksums.sh Dockerfile

      - name: Auto-commit checksum updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update dependency SHA256 checksums"
          commit_user_name: "opencode-checksum-bot"
          commit_user_email: "checksum-bot@opencode.ai"
