name: Update dependency checksums
on:
  push:
    branches:
      - 'renovate/**'

jobs:
  update:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and update SHA256 checksums
        run: .github/scripts/update-checksums.sh Dockerfile

      - name: Auto-commit checksum updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update dependency SHA256 checksums"
          commit_user_name: "renovate[bot]"
          commit_user_email: "29139614+renovate[bot]@users.noreply.github.com"
